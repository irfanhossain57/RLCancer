# =============================================================
# SC-RLOT Final Project — Master Config
# BRAC University SICIP | Deadline: 25 June 2026
# =============================================================
# HOW TO USE:
#   mode: local   → uses PBMC 3K on your HP laptop (Days 1-3)
#   mode: kaggle  → uses GSE220112 on Kaggle T4 GPU (Days 4-5)
# =============================================================

mode: local

# ── DATASET 1: PBMC Multiome 3K (Local Pipeline Test) ───────
pbmc:
  # The EXACT file you already have:
  local_path: "data/pbmc_multiome_3k/filtered_feature_bc_matrix.h5"
  # Auto-download URL (if user does not have it yet):
  download_url: "https://cf.10xgenomics.com/samples/cell-arc/2.0.0/pbmc_granulocyte_sorted_3k/pbmc_granulocyte_sorted_3k_filtered_feature_bc_matrix.h5"
  processed_h5ad: "data/pbmc_processed.h5ad"

# ── DATASET 2: GSE220112 (Kaggle — Two .h5 files) ────────────
gse220112:
  # The EXACT two files you already have (upload both to Kaggle):
  dmso_h5:   "/kaggle/input/gse220112/GSE220112_RS411_DMSO10h_filtered_feature_bc_matrix.h5"
  wee1i_h5:  "/kaggle/input/gse220112/GSE220112_RS411_Wee1i10h_filtered_feature_bc_matrix.h5"
  processed_h5ad: "/kaggle/working/gse220112_processed.h5ad"
  # Labels: DMSO = control (sensitive), Wee1i = AZD1775-treated (resistant)
  control_label:  "DMSO"
  treated_label:  "Wee1i_AZD1775"

# ── DATASET 3: GDSC2 (The exact file you have) ───────────────
gdsc2:
  # The EXACT file you already have:
  local_path: "data/gdsc2/GDSC2_fitted_dose_response_15Oct19.xlsx"
  # Auto-download URL for the same version:
  download_url: "https://cog.sanger.ac.uk/cancerrxgene/GDSC_release8.1/GDSC2_fitted_dose_response_15Oct19.xlsx"
  processed_csv: "data/gdsc2_ic50.csv"
  # ALL leukemia cell lines available in GDSC2
  leukemia_lines:
    - "MOLT-4"
    - "CCRF-CEM"
    - "NALM-6"
    - "REH"
    - "SUP-B15"
    - "RS4-11"    # RS4;11 — the exact cell line in GSE220112
    - "HL-60"
    - "KASUMI-1"
  # 5 drugs = RL action space (indices 0-4)
  drugs:
    - "AZD1775"       # action 0 — WEE1 inhibitor (same drug as GSE220112 treatment)
    - "Venetoclax"    # action 1 — BCL-2 inhibitor
    - "Dexamethasone" # action 2 — corticosteroid (standard ALL care)
    - "Cytarabine"    # action 3 — chemotherapy
    - "Imatinib"      # action 4 — kinase inhibitor

# ── MODEL HYPERPARAMETERS ────────────────────────────────────
model:
  # VAE
  n_latent: 32
  n_layers: 2
  n_hidden: 128
  # Local: 20 epochs (fast test)  |  Kaggle: 80 epochs (real training)
  n_epochs_vae: 20

  # GATv2
  gat_hidden_dim: 64
  gat_heads: 4
  n_epochs_gat: 20        # local: 20  |  kaggle: 50

  # kNN graph
  k_neighbors: 10

  # RL (PPO)
  n_actions: 5             # number of drugs
  episode_length: 10       # treatment steps per episode
  ppo_timesteps: 5000      # local: 5k  |  kaggle: 30k
  gamma: 0.99

  # SHAP
  shap_background_cells: 50
  shap_top_genes: 20

# ── SUBSAMPLING (critical for laptop survival) ────────────────
subsample:
  max_cells_local:  2000    # HP laptop: 2000 cells MAX
  max_cells_kaggle: 6000    # Kaggle T4:  6000 cells
  max_genes: 500            # highly variable genes to keep
  random_seed: 42

# ── MLFLOW ───────────────────────────────────────────────────
mlflow:
  experiment_name: "sc-rlot-cancer-drug-rl"
  # Run names for the two required experiments:
  run1_name: "experiment_1_baseline_20epochs"
  run2_name: "experiment_2_tuned_50epochs"
  tracking_uri: "./mlruns"   # kaggle: "/kaggle/working/mlruns"

# ── STREAMLIT APP ────────────────────────────────────────────
app:
  port: 8501
  title: "SC-RLOT: Cancer Drug Resistance Predictor"
  demo_cells: 100   # number of random cells to show in the UI demo
