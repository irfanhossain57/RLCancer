# =============================================================
# SC-RLOT Final Project — Master Config
# BRAC University SICIP | Deadline: 25 June 2026
# UPDATED: drugs, GDSC versions, n_subclones, VAE settings
# =============================================================

mode: local

# ── DATASET 1: PBMC Multiome 3K (Local Pipeline Test) ───────
pbmc:
  local_path: "data/pbmc_multiome_3k/filtered_feature_bc_matrix.h5"
  download_url: "https://cf.10xgenomics.com/samples/cell-arc/2.0.0/pbmc_granulocyte_sorted_3k/pbmc_granulocyte_sorted_3k_filtered_feature_bc_matrix.h5"
  processed_h5ad: "data/pbmc_processed.h5ad"

# ── DATASET 2: GSE220112 (Kaggle — Two .h5 files) ────────────
gse220112:
  dmso_h5:   "/kaggle/input/datasets/mdirfanhossain212/gse220112/GSE220112_RS411_DMSO10h_filtered_feature_bc_matrix.h5"
  wee1i_h5:  "/kaggle/input/datasets/mdirfanhossain212/gse220112/GSE220112_RS411_Wee1i10h_filtered_feature_bc_matrix (1).h5"
  processed_h5ad: "/kaggle/working/gse220112_processed.h5ad"
  control_label:  "DMSO"
  treated_label:  "Wee1i_AZD1775"

# ── DATASET 3: GDSC2 2023 version ────────────────────────────
# CHANGE: Updated from 15Oct19 → 27Oct23 (matches Kaggle notebook)
# Venetoclax + Dasatinib come from GDSC2
gdsc2:
  local_path: "data/gdsc2/GDSC2_fitted_dose_response_27Oct23.xlsx"
  download_url: "https://cog.sanger.ac.uk/cancerrxgene/GDSC_release8.5/GDSC2_fitted_dose_response_27Oct23.xlsx"
  processed_csv: "data/gdsc2_ic50.csv"
  leukemia_lines:
    - "MOLT-4"
    - "CCRF-CEM"
    - "NALM-6"
    - "REH"
    - "SUP-B15"
    - "RS4-11"
    - "HL-60"
    - "KASUMI-1"
  # CHANGE: Complete drug list update — matches Kaggle notebook exactly
  # Venetoclax + Dasatinib → GDSC2
  # Imatinib + Panobinostat + Quizartinib → GDSC1 (see gdsc1 section below)
  drugs:
    - "Venetoclax"    # action 0 — BCL-2 inhibitor
    - "Imatinib"      # action 1 — BCR-ABL/c-KIT/PDGFR kinase inhibitor
    - "Panobinostat"  # action 2 — pan-HDAC inhibitor (LBH589)
    - "Dasatinib"     # action 3 — Src/BCR-ABL/c-KIT inhibitor
    - "Quizartinib"   # action 4 — FLT3 inhibitor (AC220)

# ── DATASET 4: GDSC1 2023 (NEW — required for 3 drugs) ───────
# Imatinib, Panobinostat, Quizartinib are only in GDSC1, not GDSC2
gdsc1:
  local_path: "data/gdsc1/GDSC1_fitted_dose_response_27Oct23.xlsx"
  download_url: "https://cog.sanger.ac.uk/cancerrxgene/GDSC_release8.5/GDSC1_fitted_dose_response_27Oct23.xlsx"

# ── MODEL HYPERPARAMETERS ────────────────────────────────────
model:
  # Custom PyTorch VAE (replaces scVI — matches Kaggle notebook)
  n_latent: 32
  n_hidden: 128
  n_layers: 2                # kept for reference, VAE uses 2-layer encoder/decoder
  n_epochs_vae: 100          # Kaggle: 100 | local: 20 (fast test)

  # GATv2
  gat_hidden_dim: 64
  gat_heads: 4
  n_epochs_gat: 80           # Kaggle: 80 | local: 20

  # kNN graph
  k_neighbors: 10

  # RL (PPO)
  n_actions: 5               # number of drugs
  n_subclones: 9             # CHANGE: from Leiden clustering on 15k GSE220112 cells
  episode_length: 10
  ppo_timesteps: 50000       # Kaggle: 50000 | local: 3000
  gamma: 0.99

  # SHAP
  shap_background_cells: 30
  shap_top_genes: 20

# ── SUBSAMPLING ───────────────────────────────────────────────
subsample:
  max_cells_local:  2000
  max_cells_kaggle: 15000    # CHANGE: 6000 → 15000 (matches Kaggle notebook)
  max_genes: 500
  random_seed: 42

# ── MLFLOW ───────────────────────────────────────────────────
mlflow:
  experiment_name: "sc-rlot-cancer-drug-rl"
  run1_name: "experiment_1_baseline_20epochs"
  run2_name: "experiment_2_tuned_50epochs"
  tracking_uri: "./mlruns"

# ── STREAMLIT APP ────────────────────────────────────────────
app:
  port: 8501
  title: "SC-RLOT: Cancer Drug Resistance Predictor"
  demo_cells: 100
